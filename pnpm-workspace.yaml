# The published @deepseek-ai/dsh-client-ui-primitives@0.1.7-rc.1
# runtime/type closure needs these modules, but the published manifest moved
# them from dependencies to devDependencies (packaging regression vs 0.1.2-rc.1;
# the 0.1.7-rc.1 build adds `diff` + `simple-icons` to the needed set), so
# its declared graph no longer provides them. This metadata repair is
# workspace-only (not shipped with the plugin) and is what makes the closure
# resolvable here; without it the Vitest card suite fails with Failed to
# resolve import "clsx" (and "diff" / "simple-icons" at 0.1.7-rc.1).
# A registry consumer needs compatible modules somewhere in its own resolved
# dependency graph, pending an upstream manifest fix.
# 0.1.7-rc.2 adds first-party `@deepseek-ai/dsh-util-code-language` to the
# ui-primitives runtime import set while the published manifest again omits
# it (monorepo-only workspace:~ wiring).
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives':
    dependencies:
      '@deepseek-ai/dsh-util-code-language': '^0.1.7-rc.2'
      clsx: '^2.0.0'
      diff: '^9.0.0'
      anser: '^2.3.5'
      katex: '^0.16.47'
      shiki: '^4.3.1'
      '@shikijs/langs': '^4.3.1'
      '@types/mdast': '^4.0.4'
      'mdast-util-from-markdown': '^2.0.3'
      'mdast-util-gfm': '^3.1.0'
      'mdast-util-math': '^3.0.0'
      'micromark-core-commonmark': '^2.0.3'
      'micromark-extension-gfm': '^3.0.0'
      'micromark-extension-math': '^3.1.0'
      'micromark-factory-space': '^2.0.1'
      'micromark-util-character': '^2.1.1'
      'micromark-util-classify-character': '^2.0.1'
      'micromark-util-sanitize-uri': '^2.0.1'
      'micromark-util-symbol': '^2.0.1'
      'micromark-util-types': '^2.0.2'
      simple-icons: '16.31.0'
